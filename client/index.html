<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04080f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <title>MockDraft Showdown · 2026 NFL Draft</title>
    <meta name="description" content="Build your 32-pick 2026 NFL mock draft. Score against the real results. Prove you're the best scout." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MockDraft Showdown" />
    <meta property="og:description" content="Predict the 2026 NFL Draft. Build your mock, score against the real picks, climb the leaderboard." />
    <meta property="og:site_name" content="MockDraft Showdown" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MockDraft Showdown" />
    <meta name="twitter:description" content="Build your 2026 NFL mock draft and compete live." />

    <!-- Theme init (runs before React mounts — no FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'light' ? '#f0f2f7' : '#04080f');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
