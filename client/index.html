<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04080f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/mds-logo.png" />
    <link rel="canonical" href="https://mockdraftshowdown.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <title>MockDraft Showdown · 2026 NFL Draft</title>
    <meta name="description" content="Predict the 2026 NFL Draft and prove you're right. Build a 32-pick predictive mock and climb the live draft-night leaderboard, or GM your team through a full 7-round mock draft. 100% free." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MockDraft Showdown · 2026 NFL Draft" />
    <meta property="og:description" content="Predict the 2026 NFL Draft. Score live against the real results and climb the public leaderboard." />
    <meta property="og:site_name" content="MockDraft Showdown" />
    <meta property="og:url" content="https://mockdraftshowdown.com/" />
    <meta property="og:image" content="https://mockdraftshowdown.com/mds-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MockDraft Showdown · 2026 NFL Draft" />
    <meta name="twitter:description" content="Build your 2026 NFL mock draft and compete live on draft night." />
    <meta name="twitter:image" content="https://mockdraftshowdown.com/mds-logo.png" />

    <!-- Theme init (runs before React mounts — no FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'light' ? '#f0f2f7' : '#04080f');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
